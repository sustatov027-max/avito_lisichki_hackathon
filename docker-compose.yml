services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange_chain_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-exchange_chain}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/seeds:/seeds
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Накатывание SQL миграций
  migrations:
    image: migrate/migrate
    container_name: exchange_chain_migrations
    volumes:
      - ./backend/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-exchange_chain}?sslmode=${DB_SSLMODE:-disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exchange_chain_app
    ports:
      - '8080:8080'
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-exchange_chain}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exchange_chain_frontend
    ports:
      - '80:80'
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
