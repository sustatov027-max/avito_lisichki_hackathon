name: exchange-chain-seed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-exchange_chain}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - seed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrations:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-exchange_chain}?sslmode=${DB_SSLMODE:-disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy

  seeds:
    image: migrate/migrate
    volumes:
      - ./seed-migrations:/seed-migrations:ro
    command:
      - -path=/seed-migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-exchange_chain}?sslmode=${DB_SSLMODE:-disable}&x-migrations-table=seed_migrations
      - up
    depends_on:
      migrations:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SEED_SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-exchange_chain}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
      seeds:
        condition: service_completed_successfully

volumes:
  seed_pgdata:
